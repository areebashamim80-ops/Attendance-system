<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Attendance Management System</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0d6efd,#6ea8fe);
}

.login-box{

width:420px;
background:#fff;
padding:40px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.2);

}

.logo{

text-align:center;
margin-bottom:20px;

}

.logo i{

font-size:70px;
color:#0d6efd;

}

.logo h2{

margin-top:10px;
color:#0d6efd;

}

.logo p{

color:#666;
font-size:14px;

}

.input-group{

margin-top:20px;

}

.input-group label{

font-weight:bold;
display:block;
margin-bottom:8px;

}

.input-group input{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
outline:none;

}

.input-group input:focus{

border-color:#0d6efd;

}

button{

margin-top:25px;
width:100%;
padding:12px;
border:none;
background:#0d6efd;
color:white;
font-size:17px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#0b5ed7;

}

.footer{

margin-top:20px;
text-align:center;
color:#777;
font-size:13px;

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<i class="fas fa-user-graduate"></i>

<h2>College Attendance Management System</h2>

<p>Teacher Login</p>

</div>

<form action="/dashboard" method="GET">

<div class="input-group">

<label>Username</label>

<input
type="text"
placeholder="Enter Username"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
placeholder="Enter Password"
required>

</div>

<button type="submit">

<i class="fas fa-sign-in-alt"></i>

Login

</button>

</form>

<div class="footer">

© 2026 College Attendance Management System

</div>

</div>

</body>
</html>
