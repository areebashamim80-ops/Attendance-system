<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Student</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="sidebar">

<div class="logo">

<i class="fas fa-user-graduate"></i>

<h2>CAMS</h2>

</div>

<ul>

<li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>

<li><a href="/add"><i class="fas fa-user-plus"></i> Add Student</a></li>

<li><a href="/students"><i class="fas fa-users"></i> Student List</a></li>

<li><a href="/attendance"><i class="fas fa-calendar-check"></i> Attendance</a></li>

<li><a href="/report"><i class="fas fa-chart-bar"></i> Report</a></li>

<li><a href="/logout"><i class="fas fa-right-from-bracket"></i> Logout</a></li>

</ul>

</div>

<div class="main">

<div class="topbar">

<h2>Add Student</h2>

<div class="teacher">

<i class="fas fa-user-circle"></i>

Teacher

</div>

</div>

<div class="form-box">

<h2>Student Information</h2>

<form method="POST">

<div class="form-group">

<label>Roll Number</label>

<input
type="text"
name="roll"
value="{{ student.roll if student else '' }}"
required>

</div>

<div class="form-group">

<label>Student Name</label>

<input
type="text"
name="name"
value="{{ student.name if student else '' }}"
required>

</div>

<div class="form-group">

<label>Department</label>

<input
type="text"
name="department"
value="{{ student.department if student else '' }}"
required>

</div>

<div class="form-group">

<label>Class</label>

<input
type="text"
name="student_class"
value="{{ student.student_class if student else '' }}"
required>

</div>
<div class="form-group">

<label>Email Address</label>

<input
type="email"
name="email"
value="{{ student.email if student else '' }}"
required>

</div>

<div class="form-group">

<label>Phone Number</label>

<input
type="text"
name="phone"
value="{{ student.phone if student else '' }}"
required>

</div>

<br>

<div style="display:flex;gap:15px;">

<button
type="submit"
class="submit-btn"
style="flex:1;">

<i class="fas fa-save"></i>

Save Student

</button>

<button
type="reset"
class="submit-btn"
style="background:#6c757d;flex:1;">

<i class="fas fa-rotate-left"></i>

Reset

</button>

</div>

<br>

<div style="text-align:center;">

<a href="/dashboard"
style="
text-decoration:none;
background:#0d6efd;
color:white;
padding:12px 25px;
border-radius:8px;
display:inline-block;">

<i class="fas fa-arrow-left"></i>

Back to Dashboard

</a>

</div>

</form>

</div>

</div>

</body>

</html>
